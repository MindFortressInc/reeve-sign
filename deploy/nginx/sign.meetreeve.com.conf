server {
    server_name sign.meetreeve.com;

    client_max_body_size 50m;

    # DEV-8737 (S2 of epic DEV-8735) - agent discovery. Served from disk by
    # nginx, NOT proxied to the app container, so an agent can still learn
    # how to reach us while the sign app is down. Reeve.Play's own /start
    # 502s for exactly the opposite reason (it's a Next.js route that
    # fetches the stopped backend) -- this is the fix for that failure mode,
    # applied here before we repeat it. Exact-match `location =` blocks win
    # over the `location /` prefix match regardless of file order, but they
    # are placed above it for readability.
    location = /start {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        alias /home/ubuntu/reeve-services/static/sign/start.json;
    }

    location = /agents {
        default_type text/html;
        alias /home/ubuntu/reeve-services/static/sign/agents.html;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600;
        proxy_send_timeout 600;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sign.meetreeve.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sign.meetreeve.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = sign.meetreeve.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name sign.meetreeve.com;
    return 404; # managed by Certbot


}