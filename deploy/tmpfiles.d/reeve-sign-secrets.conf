# deploy/tmpfiles.d/reeve-sign-secrets.conf -> /etc/tmpfiles.d/reeve-sign-secrets.conf
#
# DEV-14025: /run is tmpfs and root-owned, and the secrets renderer that
# deploy/reeve-sign-up.sh runs as ubuntu cannot create a directory there.
# This recreates /run/reeve-secrets at every boot, independent of whether
# reeve-services.service (whose RuntimeDirectory= makes the same directory
# with the same mode and owner) has started yet. No age field: never cleaned.
# Apply without a reboot: sudo systemd-tmpfiles --create /etc/tmpfiles.d/reeve-sign-secrets.conf
d /run/reeve-secrets 0700 ubuntu ubuntu -
