name: Deploy contract validate

# DEV-7600 (T5b of epic DEV-4419 "the box holds nothing") — validates
# deploy.toml against the T3 (DEV-5836) schema on every push/PR touching it.
#
# Inlines pip-install + `reeve-deploy-validate` rather than calling
# reeve-services' `.github/actions/deploy-contract-publish` composite action
# directly, even though that action's own module doc names reeve-sign as
# exactly its intended cross-repo caller. Verified (2026-09-06) that its
# "Install reeve-deploy-contract" step's cross-repo branch has no `@ref` on
# the git URL (`pip install "git+https://github.com/MindFortressInc/reeve-services.git#subdirectory=packages/deploy_contract"`),
# so it always installs from reeve-services' DEFAULT branch, regardless of
# which sha this workflow pins its own `uses:` to. reeve-services' `main`
# already carries `packages/deploy_contract` (T1/T2, collect+verify) but NOT
# `schema.py` or the `reeve-deploy-validate` entry point — those are T3-only
# (confirmed: `pyproject.toml` on main registers only reeve-deploy-collect
# and reeve-deploy-verify). Calling the composite action today would checkout
# the right action.yml but still pip-install the wrong package version and
# fail every run with "command not found: reeve-deploy-validate" — a broken
# CI gate on every push to main, not a validate result. Inlining pins the
# pip install to T3's own sha explicitly, sidestepping that gap entirely.
#
# Pinned to 473b2b194f7da59fafcadd67b2c332b4f843d8f6 (T3's PR #4383,
# matt/dev-5836-t3-deploytoml-schema-parser-ci-derived-central-index, still
# open as of this writing) so this workflow validates against the exact
# schema this deploy.toml was written against. Re-pin to reeve-services'
# main (or switch to calling the composite action directly, once its
# cross-repo install step pins a ref) after DEV-5836 merges — see this PR's
# body.
#
# No ingest-url/api-key publish step: arming the central-index credentials
# is a separate ops ticket, out of scope here. This workflow is a hard
# validate gate only.

on:
  push:
    branches: ['main']
    paths:
      - 'deploy.toml'
      - '.github/workflows/deploy-contract-publish.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'deploy.toml'
      - '.github/workflows/deploy-contract-publish.yml'

permissions:
  contents: read

jobs:
  # reeve-sign is a PUBLIC repo, so a pull_request from a fork receives NO
  # secrets. Probe for the token first and report the validate job as SKIPPED
  # rather than letting it fail red on something a fork contributor cannot fix
  # (and rather than passing it, which would be a lie).
  preflight:
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.probe.outputs.has_token }}
    steps:
      - name: Probe for GH_REPO_TOKEN
        id: probe
        env:
          GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          if [ -n "${GH_REPO_TOKEN:-}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          elif [ "${IS_FORK_PR}" = "true" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GH_REPO_TOKEN unavailable (fork PR) - deploy.toml validation skipped, not passed."
          else
            echo "::error::GH_REPO_TOKEN unavailable on a trusted event (push or same-repo PR) - failing instead of silently skipping deploy.toml validation."
            exit 1
          fi

  validate:
    name: Validate deploy.toml
    needs: preflight
    if: needs.preflight.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install reeve-deploy-contract (pinned to T3's sha)
        env:
          GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
        run: |
          set -euo pipefail
          # reeve-services is PRIVATE, so pip's git fetch has to be
          # authenticated; the default GITHUB_TOKEN cannot read another repo.
          # `url.<base>.insteadOf` does that without putting the token on the
          # pip command line or in a requirements file, where it would be
          # logged. This is the org's standing mechanism -- same GH_REPO_TOKEN
          # secret and same rewrite used by reeve-tenant-backend, cleardraft-api,
          # ivorydesk-api, agentpik-backend and reeve-tenant-deploy (DEV-7629).
          git config --global url."https://x-access-token:${GH_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          trap 'git config --global --unset-all url."https://x-access-token:${GH_REPO_TOKEN}@github.com/".insteadOf || true' EXIT
          pip install "git+https://github.com/MindFortressInc/reeve-services.git@473b2b194f7da59fafcadd67b2c332b4f843d8f6#subdirectory=packages/deploy_contract"

      - name: Validate deploy.toml
        run: |
          set -euo pipefail
          reeve-deploy-validate deploy.toml --json
