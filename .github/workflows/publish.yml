name: Publish Reeve.Sign image (GHCR)

# Reeve.Sign fork build pipeline. Adapted from upstream Documenso's publish.yml:
# - publishes ONLY to GitHub Container Registry (no DockerHub),
# - builds a single native arm64 image (the reeve-ec2 deploy host is aarch64),
# - runs on a GitHub-hosted arm64 runner (free for public repos),
# - authenticates with the built-in GITHUB_TOKEN.
# Trigger manually: `gh workflow run publish.yml --ref <branch> -f tag=<tag>`.
#
# The GHCR package visibility is private (configured separately from the public repo);
# the reeve-ec2 host has no read:packages credential.
# The `export_tarball` mode pulls the already-published image inside CI (where
# GITHUB_TOKEN can read same-org packages) and uploads it as a downloadable
# artifact, so the image can be `docker load`ed onto the host without a registry
# login. Trigger: `gh workflow run publish.yml --ref <branch> -f export_tarball=true`.
#
# Digests (DEV-7600): tags are strings and can move; digests are the truth.
# Both jobs print and record two digests:
#   - manifest digest: what the registry serves for the tag (registry-side pin);
#   - image ID (config digest): the digest that survives `docker save` /
#     `docker load` inside the image itself. NOTE (DEV-9441): the box can no
#     longer *report* it -- under the containerd snapshotter image store
#     `docker image inspect` exposes only manifest digests -- so it is checked
#     by hashing the config blob out of the tarball before loading (see
#     docs/deployment-staleness.md step 5). The drift assertion in
#     deploy/check-image-drift.sh still compares against `docker inspect` and
#     is broken by that same change; see DEV-9526.
# `export_tarball` accepts an optional `digest` input and fails if the tag no
# longer resolves to it, so a tag that moved between publish and export cannot
# silently ship different bytes.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Moving image tag to publish (e.g. dev). An immutable sha-<shortsha> tag is always also pushed.'
        required: false
        default: 'dev'
        type: string
      export_tarball:
        description: 'Skip the build and export the existing :tag image as a downloadable tarball artifact instead.'
        required: false
        default: false
        type: boolean
      digest:
        description: 'REQUIRED for export_tarball (ignored otherwise): expected manifest digest (sha256:...) from the publish run. Export fails if omitted, or if :tag no longer resolves to it.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build_and_publish:
    name: Build and publish reeve-sign image (arm64)
    if: ${{ ! inputs.export_tarball }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        env:
          IMAGE: ghcr.io/mindfortressinc/reeve-sign
          TAG: ${{ inputs.tag || 'dev' }}
        run: |
          set -euo pipefail
          GIT_SHA="$(git rev-parse --short HEAD)"

          docker build \
            -f ./docker/Dockerfile \
            --progress=plain \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:sha-${GIT_SHA}" \
            .

          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:sha-${GIT_SHA}"

          # Record the digests (DEV-7600). RepoDigests is populated by the push.
          MANIFEST_DIGEST="$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:sha-${GIT_SHA}")"
          MANIFEST_DIGEST="${MANIFEST_DIGEST#*@}"
          # `.Id` is the config digest only under the CLASSIC image store, which
          # is what GitHub-hosted runners use. Under the containerd snapshotter
          # it is the manifest digest instead -- if runners ever switch, this
          # records the wrong kind of digest and the box-side check in
          # docs/deployment-staleness.md step 5 starts failing (DEV-9441).
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' "${IMAGE}:sha-${GIT_SHA}")"

          echo "Published ${IMAGE}:${TAG} and ${IMAGE}:sha-${GIT_SHA}"
          echo "manifest digest: ${MANIFEST_DIGEST}"
          echo "image ID (config digest; verify it from the tarball, not via docker inspect on the box -- DEV-9441): ${IMAGE_ID}"

          {
            echo "### Published \`${IMAGE}\`"
            echo ""
            echo "| ref | value |"
            echo "| --- | --- |"
            echo "| tags | \`${TAG}\`, \`sha-${GIT_SHA}\` |"
            echo "| manifest digest | \`${MANIFEST_DIGEST}\` |"
            echo "| image ID (config digest) | \`${IMAGE_ID}\` |"
            echo ""
            echo "Pass the manifest digest as \`-f digest=...\` to the export_tarball run."
          } >> "$GITHUB_STEP_SUMMARY"

  export_tarball:
    name: Export reeve-sign image as a tarball artifact (arm64)
    if: ${{ inputs.export_tarball }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull, verify digest, save and compress the image
        env:
          IMAGE: ghcr.io/mindfortressinc/reeve-sign
          TAG: ${{ inputs.tag || 'dev' }}
          EXPECTED_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          # CR (CLI): fail BEFORE the pull when no expected digest was given.
          # `digest` stays optional at the workflow level (publish-only runs
          # never use it), but an export with it empty skipped the comparison
          # below entirely and shipped whatever the moving tag happened to
          # resolve to — exactly the drift DEV-7600 exists to prevent.
          if [ -z "${EXPECTED_DIGEST}" ]; then
            echo "::error::export_tarball requires the 'digest' input (sha256:... as printed by the publish run)." \
              " Without it the moving :${TAG} tag could have been repointed since publish and this export would" \
              " ship unverified bytes (DEV-7600)."
            exit 1
          fi

          docker pull "${IMAGE}:${TAG}"

          MANIFEST_DIGEST="$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${TAG}")"
          MANIFEST_DIGEST="${MANIFEST_DIGEST#*@}"
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' "${IMAGE}:${TAG}")"

          if [ "${MANIFEST_DIGEST}" != "${EXPECTED_DIGEST}" ]; then
            echo "::error::${IMAGE}:${TAG} now resolves to ${MANIFEST_DIGEST}, expected ${EXPECTED_DIGEST}." \
              " The tag moved between publish and export; refusing to ship different bytes (DEV-7600)."
            exit 1
          fi

          docker save "${IMAGE}:${TAG}" | gzip > reeve-sign-image.tar.gz
          ls -lh reeve-sign-image.tar.gz

          # Shipped alongside the tarball: the config blob carrying the image ID
          # survives into the loaded image, but the manifest digest does not --
          # and on the containerd snapshotter box `docker image inspect` cannot
          # report the config digest either (DEV-9441). So this file is the only
          # record on the box side of exactly which registry bytes were
          # deployed; docs/deployment-staleness.md step 5 checks the tarball
          # against it before loading.
          {
            echo "image=${IMAGE}"
            echo "tag=${TAG}"
            echo "manifest_digest=${MANIFEST_DIGEST}"
            echo "image_id=${IMAGE_ID}"
          } | tee reeve-sign-image.digests

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: reeve-sign-image
          path: |
            reeve-sign-image.tar.gz
            reeve-sign-image.digests
          retention-days: 1
